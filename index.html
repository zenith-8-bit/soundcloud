<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SOUND-CLOUD</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            min-height: 100vh;

            font-family: "Jersey 15", sans-serif;

            background-color: rgb(74, 103, 103);
            color: rgb(229, 215, 210);

            display: flex;
            justify-content: center;
            align-items: center;

        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .box,
        .panel {

            width: min(92%, 750px);

            text-align: center;

        }


        h1 {

            font-size: clamp(55px, 10vw, 90px);

            margin: 0 0 20px;

        }


        .description {

            color: rgb(104, 184, 73);

            max-width: 520px;

            margin: 0 auto 30px;

            font-size: 20px;

            line-height: 1.3;

        }


        /* =========================
           INPUTS
        ========================= */

        input[type="text"] {

            background-color: white;

            height: 45px;

            width: 270px;

            border: none;

            border-radius: 12px;

            outline: none;

            padding: 10px 15px;

            font-family: inherit;

            font-size: 18px;

        }


        button {

            background-color: white;

            padding: 10px;

            margin: 5px;

            min-height: 45px;

            border: none;

            border-radius: 12px;

            color: rgb(107, 64, 19);

            font-family: inherit;

            font-size: 18px;

            cursor: pointer;

            transition: 0.15s;

        }


        button:hover {

            background-color: black;

            color: white;

        }


        button:active {

            transform: translateY(2px);

        }


        .create-btn {

            width: min(100%, 400px);

            margin-top: 20px;

            background-color: rgb(197, 149, 141);

        }


        /* =========================
           SIGNALING
        ========================= */

        .signal-box {

            display: none;

            margin: 20px auto;

            padding: 20px;

            max-width: 650px;

            background: rgba(0, 0, 0, 0.18);

            border-radius: 15px;

        }


        .signal-box textarea {

            width: 100%;

            min-height: 150px;

            resize: vertical;

            border: none;

            border-radius: 10px;

            padding: 12px;

            font-family: monospace;

            font-size: 12px;

        }


        .signal-title {

            color: #f6d365;

            font-size: 22px;

        }


        .status {

            font-size: 20px;

            color: #f6d365;

        }


        .error {

            color: #ff8585;

        }


        /* =========================
           AUDIO PANEL
        ========================= */

        .panel {

            display: none;

        }


        .panel-content {

            padding: 30px;

            background: rgba(0, 0, 0, 0.15);

            border-radius: 20px;

        }


        .connection {

            font-size: 25px;

        }


        .connected {

            color: #68e05d;

        }


        .disconnected {

            color: #ff7272;

        }


        .slider {

            width: 80%;

            accent-color: rgb(197, 149, 141);

        }


        .footer {

            margin-top: 30px;

        }


        a {

            color: bisque;

        }


        .hidden {

            display: none !important;

        }

    </style>

</head>


<body>


<!-- ==================================================
     HOME SCREEN
================================================== -->

<div class="box">

    <h1>SOUND-CLOUD</h1>


    <p class="description">

        Share browser audio directly between devices using
        peer-to-peer WebRTC.

        No microphone required.

    </p>


    <!-- =========================
         RECEIVER CONNECT
    ========================= -->

    <div class="retractable">

        <input
            type="text"
            id="offerInput"
            placeholder="paste offer code"
        >

        <button id="receiverBtn">
            connect
        </button>

        <p id="homeStatus" class="status">
            waiting...
        </p>

    </div>


    <!-- =========================
         TRANSMITTER
    ========================= -->

    <button
        id="createBtn"
        class="create-btn"
    >
        create a transmitter
    </button>


    <!-- =========================
         SIGNALING
    ========================= -->

    <div
        id="signalBox"
        class="signal-box"
    >

        <p
            id="signalTitle"
            class="signal-title"
        >
            connection code
        </p>


        <textarea
            id="signalOutput"
            readonly
        ></textarea>


        <button id="copyBtn">
            copy code
        </button>


        <!--
            Transmitter uses this to paste
            the receiver's answer.
        -->

        <div id="answerSection">

            <p>
                Paste the receiver's answer below:
            </p>


            <textarea
                id="answerInput"
                placeholder="paste answer code here..."
            ></textarea>


            <button id="applyAnswerBtn">
                apply answer
            </button>

        </div>


        <p id="signalStatus" class="status"></p>

    </div>


    <div class="footer">

        <p>

            made by zenith-8-bit

            <a
                href="https://github.com/zenith-8-bit"
                target="_blank"
            >
                github
            </a>

        </p>

    </div>

</div>



<!-- ==================================================
     AUDIO PANEL
================================================== -->

<div class="panel">

    <h1>AUDIO PANEL</h1>


    <div class="panel-content">


        <p id="role">
            type: unknown
        </p>


        <p class="connection">

            connection status:

            <span
                id="connectionStatus"
                class="disconnected"
            >
                disconnected
            </span>

        </p>


        <p id="audioStatus">
            waiting for audio...
        </p>


        <label>

            volume

            <br>

            <input
                type="range"
                min="0"
                max="100"
                value="100"
                id="volume"
                class="slider"
            >

        </label>


        <br><br>


        <button id="backBtn">
            back
        </button>

    </div>

</div>



<script>

$(document).ready(function () {


    /*
     * =====================================================
     * VARIABLES
     * =====================================================
     */


    let peerConnection = null;

    let localAudioStream = null;

    let remoteAudioStream = null;

    let remoteAudioElement = null;

    let role = null;


    /*
     * STUN SERVER
     *
     * Helps peers discover how to connect.
     *
     * Google provides this public STUN server.
     */

    const rtcConfig = {

        iceServers: [

            {
                urls: "stun:stun.l.google.com:19302"
            }

        ]

    };


    /*
     * =====================================================
     * INITIAL ANIMATION
     * =====================================================
     */


    $(".box h1").hide();

    $(".description").hide();

    $(".retractable").hide();

    $(".footer").hide();


    $(".box h1").slideDown(600, function () {

        $(".description").slideDown(600, function () {

            $(".retractable").slideDown(600, function () {

                $(".footer").slideDown(600);

            });

        });

    });


    /*
     * =====================================================
     * CREATE PEER CONNECTION
     * =====================================================
     */


    function createPeerConnection() {


        peerConnection =
            new RTCPeerConnection(rtcConfig);


        /*
         * -----------------------------------------------
         * ICE CANDIDATE
         * -----------------------------------------------
         *
         * We wait until ICE gathering finishes.
         *
         * This is important because our signaling is
         * manual copy/paste.
         */


        peerConnection.onicecandidate =
            function (event) {


                if (event.candidate === null) {


                    console.log(
                        "ICE gathering complete"
                    );


                    if (
                        peerConnection.localDescription
                    ) {


                        const code =
                            encodeSignal(
                                peerConnection.localDescription
                            );


                        $("#signalOutput")
                            .val(code);


                        $("#signalStatus")
                            .text(
                                "code ready — copy it to the other device"
                            );


                    }

                }

            };


        /*
         * -----------------------------------------------
         * CONNECTION STATE
         * -----------------------------------------------
         */


        peerConnection.onconnectionstatechange =
            function () {


                const state =
                    peerConnection.connectionState;


                console.log(
                    "WebRTC:",
                    state
                );


                $("#connectionStatus")
                    .text(state);


                if (state === "connected") {


                    $("#connectionStatus")
                        .removeClass(
                            "disconnected"
                        )
                        .addClass(
                            "connected"
                        );


                    $("#audioStatus")
                        .text(
                            "WebRTC connection established"
                        );

                }


                if (
                    state === "failed" ||
                    state === "disconnected" ||
                    state === "closed"
                ) {


                    $("#connectionStatus")
                        .removeClass(
                            "connected"
                        )
                        .addClass(
                            "disconnected"
                        );

                }

            };


        /*
         * -----------------------------------------------
         * RECEIVE AUDIO
         * -----------------------------------------------
         */


        peerConnection.ontrack =
            function (event) {


                console.log(
                    "Remote audio received"
                );


                remoteAudioStream =
                    event.streams[0];


                /*
                 * Create an audio element.
                 */


                if (!remoteAudioElement) {


                    remoteAudioElement =
                        document.createElement(
                            "audio"
                        );


                    remoteAudioElement.autoplay =
                        true;


                    remoteAudioElement.controls =
                        false;


                    document.body.appendChild(
                        remoteAudioElement
                    );

                }


                remoteAudioElement.srcObject =
                    remoteAudioStream;


                remoteAudioElement.volume =
                    $("#volume").val() / 100;


                /*
                 * Some browsers require
                 * play() after assigning
                 * the stream.
                 */


                remoteAudioElement
                    .play()
                    .catch(function (error) {

                        console.log(
                            "Autoplay blocked:",
                            error
                        );

                        $("#audioStatus")
                            .text(
                                "click the page to start audio"
                            );

                    });


                $("#audioStatus")
                    .text(
                        "receiving browser audio"
                    );

            };


    }


    /*
     * =====================================================
     * CREATE TRANSMITTER
     * =====================================================
     */


    $("#createBtn").click(
        async function () {


            try {


                role =
                    "transmitter";


                $("#homeStatus")
                    .text(
                        "choose the browser audio to share..."
                    );


                /*
                 * IMPORTANT:
                 *
                 * getDisplayMedia captures a screen,
                 * browser tab or window.
                 *
                 * The user can select:
                 *
                 * Browser tab + Share audio
                 *
                 * This is NOT microphone capture.
                 */


                localAudioStream =
                    await navigator.mediaDevices
                        .getDisplayMedia({

                            video: true,

                            audio: true

                        });


                console.log(
                    "Browser/system capture started"
                );


                /*
                 * We only want AUDIO.
                 *
                 * WebRTC will not send the video track.
                 */


                const audioTracks =
                    localAudioStream
                        .getAudioTracks();


                if (
                    audioTracks.length === 0
                ) {


                    alert(
                        "No audio was selected.\n\n" +
                        "When sharing a browser tab, enable \"Share audio\"."
                    );


                    localAudioStream
                        .getTracks()
                        .forEach(
                            track => track.stop()
                        );


                    return;

                }


                /*
                 * Create peer.
                 */


                createPeerConnection();


                /*
                 * Add ONLY audio.
                 */


                audioTracks.forEach(
                    function (track) {


                        peerConnection.addTrack(
                            track,
                            localAudioStream
                        );


                    }
                );


                /*
                 * Stop the video track.
                 *
                 * We requested video because
                 * browsers expose audio sharing
                 * through getDisplayMedia().
                 */


                localAudioStream
                    .getVideoTracks()
                    .forEach(
                        function (track) {

                            track.stop();

                        }
                    );


                /*
                 * Create OFFER.
                 */


                const offer =
                    await peerConnection
                        .createOffer();


                await peerConnection
                    .setLocalDescription(
                        offer
                    );


                /*
                 * Show signaling screen.
                 */


                $("#signalTitle")
                    .text(
                        "OFFER — send this to the receiver"
                    );


                $("#answerSection")
                    .show();


                $(".box").hide();

                $(".panel").show();


                $("#role")
                    .text(
                        "type: transmitter"
                    );


                $("#audioStatus")
                    .text(
                        "sharing browser audio..."
                    );


                /*
                 * Show signal box.
                 */


                $("#signalBox")
                    .show();


                $("#signalStatus")
                    .text(
                        "generating connection code..."
                    );


            }

            catch (error) {


                console.error(error);


                $("#homeStatus")
                    .text(
                        "audio sharing failed"
                    );


                alert(
                    "Could not start audio sharing.\n\n" +
                    error.message
                );

            }

        }
    );


    /*
     * =====================================================
     * RECEIVER
     * =====================================================
     */


    $("#receiverBtn").click(
        async function () {


            const offerCode =
                $("#offerInput")
                    .val()
                    .trim();


            if (!offerCode) {


                $("#homeStatus")
                    .text(
                        "paste an offer code first"
                    );


                return;

            }


            try {


                role =
                    "receiver";


                $("#homeStatus")
                    .text(
                        "processing offer..."
                    );


                /*
                 * Decode offer.
                 */


                const offer =
                    decodeSignal(
                        offerCode
                    );


                /*
                 * Create peer.
                 */


                createPeerConnection();


                /*
                 * Set remote offer.
                 */


                await peerConnection
                    .setRemoteDescription(
                        offer
                    );


                /*
                 * Create ANSWER.
                 */


                const answer =
                    await peerConnection
                        .createAnswer();


                await peerConnection
                    .setLocalDescription(
                        answer
                    );


                /*
                 * Show receiver panel.
                 */


                $(".box").hide();

                $(".panel").show();


                $("#role")
                    .text(
                        "type: receiver"
                    );


                $("#signalBox")
                    .show();


                $("#answerSection")
                    .hide();


                $("#signalTitle")
                    .text(
                        "ANSWER — send this back to transmitter"
                    );


                $("#signalStatus")
                    .text(
                        "generating answer..."
                    );


                $("#audioStatus")
                    .text(
                        "waiting for transmitter..."
                    );


            }

            catch (error) {


                console.error(error);


                $("#homeStatus")
                    .text(
                        "invalid offer"
                    );


                alert(
                    "Could not process the offer.\n\n" +
                    error.message
                );

            }

        }
    );


    /*
     * =====================================================
     * APPLY ANSWER
     * =====================================================
     */


    $("#applyAnswerBtn").click(
        async function () {


            const answerCode =
                $("#answerInput")
                    .val()
                    .trim();


            if (!answerCode) {


                $("#signalStatus")
                    .text(
                        "paste the receiver answer first"
                    );


                return;

            }


            try {


                const answer =
                    decodeSignal(
                        answerCode
                    );


                await peerConnection
                    .setRemoteDescription(
                        answer
                    );


                $("#signalStatus")
                    .text(
                        "answer applied — connecting..."
                    );


            }

            catch (error) {


                console.error(error);


                alert(
                    "Invalid answer code.\n\n" +
                    error.message
                );

            }

        }
    );


    /*
     * =====================================================
     * ENCODE SIGNAL
     * =====================================================
     *
     * Convert SDP into a copyable string.
     */


    function encodeSignal(description) {


        const json =
            JSON.stringify(description);


        /*
         * UTF-8 safe Base64.
         */


        return btoa(
            encodeURIComponent(json)
        );

    }


    /*
     * =====================================================
     * DECODE SIGNAL
     * =====================================================
     */


    function decodeSignal(code) {


        const json =
            decodeURIComponent(
                atob(code)
            );


        return JSON.parse(json);

    }


    /*
     * =====================================================
     * COPY CODE
     * =====================================================
     */


    $("#copyBtn").click(
        async function () {


            const code =
                $("#signalOutput")
                    .val();


            try {


                await navigator
                    .clipboard
                    .writeText(code);


                $("#copyBtn")
                    .text("copied!");


                setTimeout(
                    function () {

                        $("#copyBtn")
                            .text("copy code");

                    },
                    1500
                );


            }

            catch (error) {


                /*
                 * Fallback for browsers where
                 * Clipboard API is unavailable.
                 */


                $("#signalOutput")
                    .select();


                document.execCommand(
                    "copy"
                );


                $("#copyBtn")
                    .text("copied!");

            }

        }
    );


    /*
     * =====================================================
     * VOLUME
     * =====================================================
     */


    $("#volume").on(
        "input",
        function () {


            const volume =
                $(this).val() / 100;


            if (remoteAudioElement) {


                remoteAudioElement.volume =
                    volume;

            }

        }
    );


    /*
     * =====================================================
     * BACK BUTTON
     * =====================================================
     */


    $("#backBtn").click(
        function () {


            /*
             * Close WebRTC.
             */


            if (peerConnection) {

                peerConnection.close();

            }


            /*
             * Stop captured audio.
             */


            if (localAudioStream) {


                localAudioStream
                    .getTracks()
                    .forEach(
                        function (track) {

                            track.stop();

                        }
                    );

            }


            location.reload();

        }
    );


    /*
     * =====================================================
     * SAFETY CHECK
     * =====================================================
     *
     * getDisplayMedia requires a secure context.
     */


    if (
        !window.isSecureContext &&
        location.hostname !== "localhost"
    ) {


        $("#homeStatus")
            .text(
                "Use HTTPS or localhost for audio sharing."
            )
            .addClass("error");

    }

});

</script>

</body>
</html>
